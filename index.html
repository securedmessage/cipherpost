    async get(k) { return this.m.has(k) ? this.m.get(k) : null; }
    async put(k, v) { this.m.set(k, v); }
    async del(k) { this.m.delete(k); }
    async keys() { return [...this.m.keys()]; }
    async clear() { this.m.clear(); }
  }

  class IDBBackend {
    constructor(name = 'cipherpost2') { this.name = name; this.db = null; }
    async open() {
      if (this.db) return this.db;
      this.db = await new Promise((res, rej) => {
        const r = G.indexedDB.open(this.name, 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });

    }
    async tx(mode, fn) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const t = db.transaction('kv', mode), s = t.objectStore('kv');
        const req = fn(s);
        t.oncomplete = () => res(req ? req.result : undefined);

    async put(k, v) { await this.tx('readwrite', s => s.put(v, k)); }
    async del(k) { await this.tx('readwrite', s => s.delete(k)); }
    async keys() { return this.tx('readonly', s => s.getAllKeys()); }
    async clear() { await this.tx('readwrite', s => s.clear()); }
  }

  class WrongPasscode extends Error { constructor() { super('Wrong passcode'); this.wrongPasscode = true; } }
  class LockedOut extends Error { constructor(ms) { super('Too many attempts'); this.lockedOut = true; this.waitMs = ms; } }
  class Erased extends Error { constructor() { super('Too many wrong passcodes — data erased'); this.erased = true; } }

  const MAX_FAILS = 10;

  /** Lockout after the 5th wrong passcode: 30 s, doubling, capped at 15 min. */
  function lockoutMs(fails) { return fails < 5 ? 0 : Math.min(15 * 60000, 30000 * 2 ** Math.min(fails - 5, 5)); }

  class Store {
    /** device: optional {seal(Uint8Array)→Promise<Uint8Array>, open(...)} binding data to this phone. */
    constructor(backend, device, clock) {
      this.b = backend; this.device = device || null; this.now = clock || (() => Date.now());
      this.dek = null; this.key = null;
    }
    async meta() { const m = await this.b.get('meta'); return m ? JSON.parse(m) : null; }
    async writeMeta(m) { await this.b.put('meta', JSON.stringify(m)); }
    async exists() { return !!(await this.meta()); }
    isOpen() { return !!this.key; }

    async wrap(pass, rounds) {
      const salt = CP2.rand(16);
      const kek = await CP2.passKey(pass, salt, rounds);
      let w = await CP2.gcmSeal(kek, this.dek, CP2.utf8('CP2 dek'));
      if (this.device) w = await this.device.seal(w);
      return { salt: CP2.b64e(salt), rounds, wrapped: CP2.b64e(w) };
    }

    async create(pass, publicId, opts = {}) {
      await this.b.clear();
      this.dek = CP2.rand(32);
      this.key = await CP2.aesKey(this.dek);
      const m = Object.assign(await this.wrap(pass, opts.rounds || CP2.PBKDF2_ROUNDS),
        { v: 2, id: publicId, fails: 0, lockoutUntil: 0, wipe: opts.wipe !== false, device: !!this.device, created: this.now() });
      await this.writeMeta(m);
    }

    async unlock(pass) {
      const m = await this.meta();
      if (!m) throw new Error('No data');
      const wait = (m.lockoutUntil || 0) - this.now();
      if (wait > 0) throw new LockedOut(wait);
      let dek;
      try {
        let w = CP2.b64d(m.wrapped);
        if (m.device) {
          if (!this.device) throw new Error('This data can only be opened in the CipherPost app on its own phone');
          w = await this.device.open(w);
        }
        const kek = await CP2.passKey(pass, CP2.b64d(m.salt), m.rounds);
        try { dek = await CP2.gcmOpen(kek, w, CP2.utf8('CP2 dek')); } catch (e) { throw new WrongPasscode(); }
      } catch (e) {
        if (!e.wrongPasscode) throw e;
        m.fails = (m.fails || 0) + 1;
        m.lockoutUntil = this.now() + lockoutMs(m.fails);
        if (m.fails >= MAX_FAILS && m.wipe) { await this.erase(); throw new Erased(); }
        await this.writeMeta(m);
        throw e;
      }
      const hadFails = m.fails || 0;
      m.fails = 0; m.lockoutUntil = 0;
      await this.writeMeta(m);
      this.dek = dek; this.key = await CP2.aesKey(dek);
      return { hadFails };
    }

    async unlockWithDek(dek) {
      if (!(await this.meta())) throw new Error('No data');
      this.dek = new Uint8Array(dek); this.key = await CP2.aesKey(this.dek);
      // proves the key is right before anyone relies on it
      await this.get('state');
    }

    exportDek() { if (!this.dek) throw new Error('Locked'); return new Uint8Array(this.dek); }

    lock() { if (this.dek) this.dek.fill(0); this.dek = null; this.key = null; }

    async changePasscode(oldPass, newPass) {
      const m = await this.meta();
      const saved = { dek: this.dek, key: this.key };
      const probe = new Store(this.b, this.device, this.now);
      await probe.unlock(oldPass); // throws WrongPasscode (and counts it)
      probe.lock();
      this.dek = saved.dek; this.key = saved.key;
      Object.assign(m, await this.wrap(newPass, m.rounds), { fails: 0, lockoutUntil: 0 });
      await this.writeMeta(m);
    }

    async setWipe(on) { const m = await this.meta(); m.wipe = !!on; await this.writeMeta(m); }

    async get(name) {
      if (!this.key) throw new Error('Locked');
      const v = await this.b.get('r:' + name);
      if (!v) return null;
      return JSON.parse(CP2.str(await CP2.gcmOpen(this.key, v, CP2.utf8('r:' + name))));
    }
    async put(name, obj) {
      if (!this.key) throw new Error('Locked');
      await this.b.put('r:' + name, await CP2.gcmSeal(this.key, CP2.utf8(JSON.stringify(obj)), CP2.utf8('r:' + name)));
    }
    async getBlob(name) {
      if (!this.key) throw new Error('Locked');
      const v = await this.b.get('b:' + name);
      return v ? CP2.gcmOpen(this.key, v, CP2.utf8('b:' + name)) : null;
    }
    async putBlob(name, bytes) {
      if (!this.key) throw new Error('Locked');
      await this.b.put('b:' + name, await CP2.gcmSeal(this.key, bytes, CP2.utf8('b:' + name)));
    }
    async delBlob(name) { await this.b.del('b:' + name); }
    async erase() { this.lock(); await this.b.clear(); }
  }

  Object.assign(CP2, { MemoryBackend, IDBBackend, Store, WrongPasscode, LockedOut, Erased, MAX_FAILS, lockoutMs });
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* CipherPost 2 — relay client (ntfy protocol). © 2026 RM Software. See DESIGN.md "Transport".
   Uses only "simple" requests (GET, and POST without custom headers) so browsers need no CORS preflight. */
(function (G) {
  'use strict';
  const CP2 = G.CP2 = G.CP2 || {};

  class RelayError extends Error { constructor(msg, status) { super(msg); this.status = status; } }
  class Expired extends Error { constructor() { super('File link expired'); this.expired = true; } }

  class Relay {
    constructor(fetchImpl) { this.fetch = fetchImpl || G.fetch.bind(G); }

    /** quiet=true marks receipts and re-send requests (tag "q") so a phone's background check does not
        announce them as new messages. The tag says nothing about content. */
    async publish(base, topic, text, quiet) {
      const r = await this.fetch(`${base}/${topic}${quiet ? '?tags=q' : ''}`, { method: 'POST', body: text, cache: 'no-store', referrerPolicy: 'no-referrer' });
      if (!r.ok) throw new RelayError(r.status === 429 ? 'Relay is busy — will retry' : `Relay error ${r.status}`, r.status);
      return r.json();
    }

    /** Uploads bytes as an attachment; returns its download URL. */
    async upload(base, topic, bytes) {
      const name = 'cp2-' + CP2.hex(CP2.rand(6)) + '.bin';
      const r = await this.fetch(`${base}/${topic}?f=${name}`, { method: 'POST', body: bytes, cache: 'no-store', referrerPolicy: 'no-referrer' });
      if (!r.ok) throw new RelayError(r.status === 413 ? 'File is too large for the relay' : `Relay error ${r.status}`, r.status);
      const j = await r.json();
      if (!j.attachment || !j.attachment.url) throw new RelayError('Relay did not store the file', 0);
      return j.attachment.url;
    }

    /** Returns message events after `since` (a relay message id, or 'all'). */
    async poll(base, topic, since) {
      const r = await this.fetch(`${base}/${topic}/json?poll=1&since=${encodeURIComponent(since || 'all')}`, { cache: 'no-store', referrerPolicy: 'no-referrer' });
      if (!r.ok) throw new RelayError(`Relay error ${r.status}`, r.status);
      const out = [];
      for (const line of (await r.text()).split('\n')) {
        if (!line.trim()) continue;
        try { const e = JSON.parse(line); if (e.event === 'message') out.push(e); } catch (x) { /* ignore partial line */ }
      }
      return out;
    }

    async download(url) {
      const r = await this.fetch(url, { cache: 'no-store', referrerPolicy: 'no-referrer' });
      if (r.status === 404 || r.status === 410) throw new Expired();
      if (!r.ok) throw new RelayError(`Relay error ${r.status}`, r.status);
      return new Uint8Array(await r.arrayBuffer());
    }

    /** Live updates while the page is open. Returns a function that stops listening. */
    subscribe(base, topic, onEvent) {
      if (!G.EventSource) return () => {};
      const es = new G.EventSource(`${base}/${topic}/sse`);
      es.onmessage = ev => { try { const e = JSON.parse(ev.data); if (e.event === 'message') onEvent(e); } catch (x) { /* ignore */ } };
      return () => es.close();
    }
  }

  Object.assign(CP2, { Relay, RelayError, Expired });
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* CipherPost 2 — engine: contacts, invites, delivery, files, audit. © 2026 RM Software. See DESIGN.md. */
(function (G) {
  'use strict';
  const CP2 = G.CP2 = G.CP2 || {};

  const HOUR = 3600e3, DAY = 24 * HOUR, MIN = 60e3;
  const REPUBLISH_AFTER = 6 * HOUR, GIVE_UP_AFTER = 14 * DAY, INVITE_LIFE = 30 * DAY, SMS_GAP = 15 * MIN;
  const MAX_FILE = 15 * 1024 * 1024;          // relay attachment limit
  const MAX_INLINE = 3900;                     // relay text limit is 4,096 bytes
  const TEXT_MIME = 'application/x-cp2-text';  // long messages travel like files
  const newId = () => CP2.hex(CP2.rand(16));

  class Engine {
    /**
     * opts: {store, relay, role: 'staff'|'patient', page: patient page URL, clock, audit: bool, onChange}
     */
    constructor(opts) {
      this.store = opts.store; this.relay = opts.relay; this.role = opts.role;
      this.page = (opts.page || '').replace(/#.*$/, '');
      this.now = opts.clock || (() => Date.now());
      this.auditOn = opts.audit !== undefined ? !!opts.audit : opts.role === 'staff';
      this.onChange = opts.onChange || (() => {});
      this.s = null;            // decrypted state while unlocked
      this.q = Promise.resolve(); // serializes saves
      this.syncing = null;
    }

    // ============================================================ lifecycle
    isUnlocked() { return !!this.s; }

    async create(name, pass, relayUrl, storeOpts) {
      const me = await CP2.newIdentity(this.role === 'patient' ? 'Patient' : String(name).trim().slice(0, 60), this.role, relayUrl.replace(/\/+$/, ''));
      const id = await CP2.idOfMe(me);
      await this.store.create(pass, id, storeOpts);
      this.s = { v: 2, me, id, card: await CP2.makeCard(me), contacts: {}, invites: [], outbox: [], seen: null,
                 settings: { autoLockMin: 5, retentionDays: 0, smsNotices: true }, audit: [], created: this.now() };
      this.audit('identity_created', `User id ${id.slice(0, 8)}, ${this.role}`);
      await this.save();
      return this.s.id;
    }

    async unlock(pass) {
      const r = await this.store.unlock(pass);
      await this.load(r.hadFails ? `Unlocked after ${r.hadFails} wrong passcode(s)` : 'Unlocked with passcode');
    }
    async unlockWithDek(dek, how) { await this.store.unlockWithDek(dek); await this.load(how || 'Unlocked with fingerprint, face or phone lock'); }
    async load(how) {
      this.s = await this.store.get('state');
      if (!this.s) throw new Error('Data is damaged');
      this.audit('unlock', how);
      await this.applyRetention();
      await this.save();
    }
    lock(reason) {
      if (this.s && reason) { this.audit('lock', reason); this.save().catch(() => {}); }
      const done = this.q.then(() => this.store.lock());
      this.s = null;
      return done;
    }
    async changePasscode(oldPass, newPass) {
      await this.store.changePasscode(oldPass, newPass);
      this.audit('passcode_changed', ''); await this.save();
    }
    async erase() { this.s = null; await this.store.erase(); }

    /** Saves a snapshot of the state as it is now (even if the engine locks meanwhile). Saves run in order. */
    save() {
      const snap = this.s;
      this.q = this.q.then(async () => {
        if (!snap) return;
        await Engine.sealAudit(snap);
        await this.store.put('state', snap);
      }).catch(e => { console.error('save failed', e); });
      return this.q;
    }
    changed() { try { this.onChange(); } catch (e) { console.error(e); } }

    // ============================================================ reading state
    get me() { return this.s.me; }
    get myId() { return this.s.id; }
    contact(id) { return this.s.contacts[id] || null; }
    contacts() { return Object.values(this.s.contacts).sort((a, b) => (b.last || 0) - (a.last || 0)); }
    messages(cid) { const c = this.contact(cid); return c ? c.msgs : []; }
    settings() { return this.s.settings; }
    pendingInvites() {
      const cutoff = this.now() - INVITE_LIFE;
      return this.s.invites.filter(i => i.created >= cutoff).sort((a, b) => b.created - a.created);
    }
    async mySafetyCode() { return CP2.safetyCode(CP2.b64d(this.s.me.agreePub), CP2.b64d(this.s.me.signPub)); }
    async safetyCodeOf(cid) { const c = this.contact(cid); return CP2.safetyCode(CP2.b64d(c.agreePub), CP2.b64d(c.signPub)); }
    unreadCount() { let n = 0; for (const c of Object.values(this.s.contacts)) n += c.unread || 0; return n; }
    markRead(cid) { const c = this.contact(cid); if (c && c.unread) { c.unread = 0; this.save(); } }

    // ============================================================ settings
    setSetting(k, v, label) {
      this.s.settings[k] = v;
      this.audit('setting_changed', `${label || k}: ${v}`);
      return this.save();
    }

    // ============================================================ invites
    createInvite(type, name, phone, email) {
      if (this.role !== 'staff') throw new Error('Only staff can invite');
      if (type !== 'patient' && type !== 'staff') throw new Error('Bad invite type');
      const id = CP2.hex(CP2.rand(8)), secret = CP2.rand(16);
      this.s.invites.push({ id, s: CP2.b64e(secret), type, name: String(name).trim().slice(0, 60),
                            phone: (phone || '').trim(), email: (email || '').trim(), created: this.now() });
      this.audit(type === 'patient' ? 'patient_invited' : 'colleague_invited', `Invite ${id.slice(0, 8)} for "${name}"`);
      this.save();
      return { id, link: `${this.page}#${CP2.inviteCode(this.s.card, id, secret, type)}` };
    }
    inviteLink(id) {
      const i = this.s.invites.find(x => x.id === id);
      return i ? `${this.page}#${CP2.inviteCode(this.s.card, id, CP2.b64d(i.s), i.type)}` : null;
    }
    cancelInvite(id) {
      this.s.invites = this.s.invites.filter(i => i.id !== id);
      this.audit('invite_cancelled', `Invite ${id.slice(0, 8)}`);
      return this.save();
    }

    /** Checks that an invite may be accepted here (before creating an identity for it). */
    static checkInviteFor(role, inv) {
      if (inv.type === 'patient' && role !== 'patient') throw new Error('This invite is for a patient. Open it on the patient\'s phone, in a web browser.');
      if (inv.type === 'staff' && role !== 'staff') throw new Error('This invite is for staff. Open it on a phone with the CipherPost app.');
    }

    /** Accepts an invite: adds the inviter (verified) and sends our join through the relay. */
    async acceptInvite(inv) {
      Engine.checkInviteFor(this.role, inv);
      if (inv.inviter.id === this.s.id) throw new Error('That is your own invite.');
      const existing = this.contact(inv.inviter.id);
      const c = this.addContact(inv.inviter, inv.inviter.name, 'their invite link');
      const mac = await CP2.joinMac(inv.secret, CP2.unhex(inv.id), this.s.card);
      await this.queue(c.id, { t: 'join', id: newId(), inv: inv.id, card: this.s.card, mac: CP2.b64e(mac) }, true);
      this.audit('invite_accepted', `From ${this.label(c)}`);
      await this.save();
      this.flush();
      return { contact: c, existed: !!existing };
    }

    addContact(card, name, via) {
      let c = this.s.contacts[card.id];
      if (!c) {
        c = this.s.contacts[card.id] = { id: card.id, msgs: [], unread: 0, created: this.now(), last: this.now() };
        this.audit('contact_connected', `${name} (${card.id.slice(0, 8)}), ${card.role}, verified automatically via ${via}`);
      }
      Object.assign(c, { name, role: card.role, agreePub: card.agreePub, signPub: card.signPub, inbox: card.inbox,
                         relay: card.relay, card: card.card, verified: true });
      return c;
    }
    label(c) { return `"${c.name}" (${c.id.slice(0, 8)})`; }

    // ============================================================ sending
    async send(cid, text) {
      const c = this.contact(cid);
      text = String(text || '');
      if (!c || !text.trim()) return null;
      const m = { id: newId(), out: true, ts: this.now(), text, status: 'sending' };
      c.msgs.push(m); c.last = m.ts;
      const obj = { t: 'msg', id: m.id, ts: m.ts, text };
      const sealed = await CP2.seal(obj, this.s.me, c);
      if (sealed.length > MAX_INLINE) {
        const bytes = CP2.utf8(text);
        await this.store.putBlob('f:' + m.id, bytes);
        m.long = true;
        await this.queueFile(c, m, { name: 'message.txt', mime: TEXT_MIME, size: bytes.length, cap: '' });
      } else {
        this.enqueue(c, m.id, sealed, true);
      }
      this.audit('message_sent', `To ${this.label(c)}, ref ${m.id.slice(0, 8)}`);
      await this.save(); this.changed(); this.flush();
      return { msg: m, smsNotice: this.smsNoticeDue(c) };
    }

    async sendFile(cid, file, caption) {
      const c = this.contact(cid);
      if (!c) return null;
      if (file.bytes.length > MAX_FILE) throw new Error('Files can be up to 15 MB');
      const m = { id: newId(), out: true, ts: this.now(), text: String(caption || ''), status: 'sending',
                  file: { name: String(file.name || 'file').slice(0, 120), mime: file.mime || 'application/octet-stream', size: file.bytes.length, state: 'ready' } };
      c.msgs.push(m); c.last = m.ts;
      await this.store.putBlob('f:' + m.id, file.bytes);
      await this.queueFile(c, m, { name: m.file.name, mime: m.file.mime, size: m.file.size, cap: m.text });
      this.audit('file_sent', `To ${this.label(c)}, ${m.file.mime}, ${m.file.size} bytes, ref ${m.id.slice(0, 8)}`);
      await this.save(); this.changed(); this.flush();
      return { msg: m, smsNotice: this.smsNoticeDue(c) };
    }

    /** Files are uploaded when the outbox is flushed (so a failed upload is retried). */
    async queueFile(c, m, meta) {
      this.s.outbox.push({ eid: newId(), to: c.id, ack: m.id, upload: { msgId: m.id, meta }, body: null, created: this.now(), sent: 0 });
    }

    async queue(cid, obj, needsAck) {
      const c = this.contact(cid);
      this.enqueue(c, needsAck ? obj.id : null, await CP2.seal(obj, this.s.me, c), needsAck);
    }
    enqueue(c, ackId, body, needsAck) {
      this.s.outbox.push({ eid: newId(), to: c.id, ack: needsAck ? ackId : null, body, created: this.now(), sent: 0, quiet: !needsAck });
    }

    /** Publishes what is due: new items, and unacknowledged items every 6 h for up to 14 days. */
    flush() {
      if (this.flushing) { this.flushAgain = true; return this.flushing; }
      this.flushing = (async () => {
        do {
          this.flushAgain = false;
          for (const e of [...(this.s ? this.s.outbox : [])]) {
            if (!this.s) return;
            const c = this.contact(e.to);
            const age = this.now() - e.created;
            if (!c || (e.ack && age > GIVE_UP_AFTER)) { this.dropEntry(e, 'failed'); continue; }
            if (e.sent && this.now() - e.sent < REPUBLISH_AFTER) continue;
            try {
              if (e.upload && !e.body) await this.doUpload(c, e);
              await this.relay.publish(c.relay, c.inbox, e.body, !!e.quiet);
              e.sent = this.now(); e.tries = (e.tries || 0) + 1;
              if (!e.ack) this.s.outbox = this.s.outbox.filter(x => x !== e);
              else this.setStatus(c, e.ack, s => s === 'sending' ? 'sent' : s);
            } catch (err) {
              e.lastError = err.message;
              if (err.status === 413) { this.dropEntry(e, 'failed'); continue; }
              break; // relay unreachable or busy: try again on the next flush
            }
          }
          await this.save(); this.changed();
        } while (this.flushAgain);
      })().finally(() => { this.flushing = null; });
      return this.flushing;
    }

    async doUpload(c, e) {
      const bytes = await this.store.getBlob('f:' + e.upload.msgId);
      if (!bytes) throw Object.assign(new Error('File no longer on this device'), { status: 413 });
      const enc = await CP2.encryptBlob(bytes);
      const url = await this.relay.upload(c.relay, c.inbox, enc.blob);
      const m = c.msgs.find(x => x.id === e.upload.msgId);
      const meta = e.upload.meta;
      e.body = await CP2.seal({ t: 'file', id: e.upload.msgId, ts: m ? m.ts : this.now(), name: meta.name, mime: meta.mime,
                                size: meta.size, cap: meta.cap, url, key: enc.key, sha: enc.sha }, this.s.me, c);
    }

    dropEntry(e, status) {
      this.s.outbox = this.s.outbox.filter(x => x !== e);
      const c = this.contact(e.to);
      if (c && e.ack) this.setStatus(c, e.ack, s => s === 'delivered' ? s : status);
    }
    setStatus(c, id, f) { const m = c.msgs.find(x => x.id === id && x.out); if (m) m.status = f(m.status); }

    // ============================================================ SMS notices (staff → patient)
    smsNoticeDue(c) {
      if (this.role !== 'staff' || c.role !== 'patient' || !c.phone || !this.s.settings.smsNotices) return null;
      if (this.now() - (c.lastSms || 0) < SMS_GAP && !c.repliedSinceSms) return null;
      return { phone: c.phone, text: `You have a new message from ${this.s.me.name}. Read it here: ${this.page}` };
    }
    noteSmsSent(cid) { const c = this.contact(cid); if (c) { c.lastSms = this.now(); c.repliedSinceSms = false; this.audit('sms_notice', `To ${this.label(c)}`); this.save(); } }

    // ============================================================ receiving
    /** Fetches new relay messages, handles them, then flushes the outbox. */
    sync() {
      if (!this.s) return Promise.resolve({ received: 0 });
      if (this.syncing) return this.syncing;
      this.syncing = (async () => {
        const evs = await this.relay.poll(this.s.me.relay, this.s.me.inbox, this.s.seen || 'all');
        let received = 0;
        for (const ev of evs) {
          if (!this.s) break;
          received += await this.handle(ev.message);
          this.s.seen = ev.id;
        }
        await this.sendAcks();
        await this.save();
        if (received) this.changed();
        await this.flush();
        return { received };
      })().finally(() => { this.syncing = null; });
      return this.syncing;
    }

    /** Live event from the relay subscription. */
    async live(ev) {
      if (!this.s) return;
      const n = await this.handle(ev.message);
      if (this.s) this.s.seen = ev.id;
      await this.sendAcks(); await this.save(); if (n) this.changed(); this.flush();
    }

    /** Handles one relay text. Returns the number of new user-visible items. */
    async handle(text) {
      if (!this.s || !CP2.peek(text)) return 0;
      let r;
      try { r = await CP2.open(text, this.s.me, id => { const c = this.contact(id); return c && c.verified ? c : null; }); }
      catch (e) { return 0; } // not for us, unknown sender, or tampered: ignore
      const o = r.obj;
      this.pendingAcks = this.pendingAcks || {};
      const ackLater = (cid, id) => { (this.pendingAcks[cid] = this.pendingAcks[cid] || new Set()).add(id); };
      if (o.t === 'join') return this.onJoin(r.sender, o, ackLater);
      const c = this.contact(r.sender.id);
      if (!c) return 0;
      c.lastInbound = this.now();
      switch (o.t) {
        case 'msg': {
          ackLater(c.id, o.id);
          if (c.msgs.some(m => m.id === o.id)) return 0;
          c.msgs.push({ id: o.id, out: false, ts: o.ts, rx: this.now(), text: String(o.text || '') });
          c.repliedSinceSms = true;
          c.last = this.now(); c.unread = (c.unread || 0) + 1;
          this.audit('message_received', `From ${this.label(c)}, ref ${o.id.slice(0, 8)}`);
          return 1;
        }
        case 'file': {
          let m = c.msgs.find(x => x.id === o.id);
          const isNew = !m;
          // acknowledge only once we really have the file, so an expired link leads to a re-send
          if (m && (!m.file || m.file.state === 'ready')) { ackLater(c.id, o.id); return 0; }
          if (!m) {
            m = { id: o.id, out: false, ts: o.ts, rx: this.now(), text: String(o.cap || ''),
                  file: { name: String(o.name || 'file'), mime: String(o.mime || 'application/octet-stream'), size: o.size | 0 } };
            c.msgs.push(m); c.last = this.now(); c.unread = (c.unread || 0) + 1;
          }
          Object.assign(m.file, { url: o.url, key: o.key, sha: o.sha, state: 'downloading' });
          await this.fetchFile(c, m);
          if (!m.file || m.file.state === 'ready') ackLater(c.id, o.id);
          if (isNew) this.audit(m.file ? 'file_received' : 'message_received', `From ${this.label(c)}, ${o.mime}, ${o.size} bytes, ref ${o.id.slice(0, 8)}`);
          return isNew ? 1 : 0;
        }
        case 'ack': {
          for (const id of (o.ids || [])) {
            this.setStatus(c, id, () => 'delivered');
            this.s.outbox = this.s.outbox.filter(e => !(e.to === c.id && e.ack === id));
          }
          return 0;
        }
        case 'resend': {
          const m = c.msgs.find(x => x.id === o.id && x.out && (x.file || x.long));
          if (!m) return 0;
          const meta = m.long ? { name: 'message.txt', mime: TEXT_MIME, size: CP2.utf8(m.text).length, cap: '' }
                              : { name: m.file.name, mime: m.file.mime, size: m.file.size, cap: m.text };
          const e = this.s.outbox.find(x => x.to === c.id && x.ack === m.id);
          if (e) Object.assign(e, { upload: { msgId: m.id, meta }, body: null, sent: 0 });   // upload again now
          else await this.queueFile(c, m, meta);
          return 0;
        }
        default: return 0;
      }
    }

    async onJoin(sender, o, ackLater) {
      const known = this.contact(sender.id);
      if (known) { ackLater(known.id, o.id); return 0; }  // repeat of a join we already accepted
      const inv = this.s.invites.find(i => i.id === o.inv);
      if (!inv || this.now() - inv.created > INVITE_LIFE) { this.audit('join_rejected', `No open invite ${String(o.inv).slice(0, 8)}`); return 0; }
      if (inv.type !== sender.role) { this.audit('join_rejected', `Invite ${inv.id.slice(0, 8)} was for a ${inv.type}`); return 0; }
      const expect = await CP2.joinMac(CP2.b64d(inv.s), CP2.unhex(inv.id), sender.card);
      if (!CP2.eq(expect, CP2.b64d(o.mac || ''))) { this.audit('join_rejected', `Invite ${inv.id.slice(0, 8)} check failed`); return 0; }
      const c = this.addContact(sender, inv.name, `invite ${inv.id.slice(0, 8)}`);
      c.phone = inv.phone; c.email = inv.email; c.unread = (c.unread || 0) + 1; c.joined = this.now();
      this.s.invites = this.s.invites.filter(i => i !== inv);
      ackLater(c.id, o.id);
      return 1;
    }

    async sendAcks() {
      if (!this.s) return;
      const p = this.pendingAcks; this.pendingAcks = {};
      for (const cid in (p || {})) {
        const c = this.contact(cid);
        if (c) this.enqueue(c, null, await CP2.seal({ t: 'ack', ids: [...p[cid]] }, this.s.me, c), false);
      }
    }

    // ============================================================ files
    async fetchFile(c, m) {
      try {
        const blob = await this.relay.download(m.file.url);
        const bytes = await CP2.decryptBlob(blob, m.file.key, m.file.sha);
        if (m.file.mime === TEXT_MIME) { m.text = CP2.str(bytes); delete m.file; return; }
        await this.store.putBlob('f:' + m.id, bytes);
        m.file.state = 'ready';
        delete m.file.key; delete m.file.url; delete m.file.sha;
      } catch (e) {
        if (e.expired) {
          m.file.state = 'requested';
          await this.queue(c.id, { t: 'resend', id: m.id }, false);
        } else {
          m.file.state = 'failed'; m.file.error = e.message;
        }
      }
    }

    /** Retries files that failed to download (e.g. the relay was briefly unreachable). */
    async retryFile(cid, msgId) {
      const c = this.contact(cid), m = c && c.msgs.find(x => x.id === msgId);
      if (!m || !m.file || m.file.state === 'ready') return;
      if (m.file.url) await this.fetchFile(c, m);
      else { m.file.state = 'requested'; await this.queue(c.id, { t: 'resend', id: m.id }, false); }
      await this.save(); this.changed(); this.flush();
    }

    async fileBytes(cid, msgId, purpose) {
      const c = this.contact(cid), m = c && c.msgs.find(x => x.id === msgId);
      if (!m || !m.file) throw new Error('No such file');
      const b = await this.store.getBlob('f:' + msgId);
      if (!b) throw new Error('This file is not on this device');
      if (purpose) { this.audit(purpose === 'save' ? 'file_saved' : 'file_viewed', `${m.file.mime} ${m.out ? 'to' : 'from'} ${this.label(c)}, ref ${msgId.slice(0, 8)}${purpose === 'save' ? ', unencrypted copy outside CipherPost' : ''}`); await this.save(); }
      return b;
    }

    // ============================================================ deleting & retention
    async deleteMessage(cid, msgId) {
      const c = this.contact(cid); if (!c) return;
      c.msgs = c.msgs.filter(m => m.id !== msgId);
      await this.store.delBlob('f:' + msgId);
      this.audit('message_deleted', `${this.label(c)}, ref ${msgId.slice(0, 8)}`);
      await this.save(); this.changed();
    }
    async deleteContact(cid) {
      const c = this.contact(cid); if (!c) return;
      for (const m of c.msgs) await this.store.delBlob('f:' + m.id);
      delete this.s.contacts[cid];
      this.s.outbox = this.s.outbox.filter(e => e.to !== cid);
      this.audit('contact_deleted', `${this.label(c)} and ${c.msgs.length} message(s)`);
      await this.save(); this.changed();
    }
    async applyRetention() {
      const days = this.s.settings.retentionDays | 0;
      if (!days) return 0;
      const cutoff = this.now() - days * DAY;
      let n = 0;
      for (const c of Object.values(this.s.contacts)) {
        const keep = [];
        for (const m of c.msgs) {
          if ((m.rx || m.ts) < cutoff && m.status !== 'sending') { n++; await this.store.delBlob('f:' + m.id); } else keep.push(m);
        }
        c.msgs = keep;
      }
      if (n) this.audit('retention_purge', `${n} message(s) older than ${days} days deleted`);
      return n;
    }

    // ============================================================ audit (staff)
    audit(event, detail) {
      if (!this.auditOn || !this.s) return;
      this.s.audit.push({ t: this.now(), e: event, d: String(detail || ''), p: null, h: null });
    }
    /** Fills in the hash chain for new entries (async crypto, so done just before each save). */
    static async sealAudit(st) {
      const a = st.audit || [];
      for (let i = 0; i < a.length; i++) {
        if (a[i].h) continue;
        a[i].p = i ? a[i - 1].h : '';
        a[i].h = await CP2.hmacChain(a[i].p, { t: a[i].t, e: a[i].e, d: a[i].d });
      }
      if (a.length > 20000) st.audit = a.slice(a.length - 20000);
    }
    /** Returns -1 if every entry links to the one before it, else the index of the first bad entry. */
    async verifyAudit() {
      await Engine.sealAudit(this.s);
      const a = this.s.audit;
      for (let i = 0; i < a.length; i++) {
        const p = i ? a[i - 1].h : a[i].p;
        if (a[i].p !== p) return i;
        if (await CP2.hmacChain(a[i].p, { t: a[i].t, e: a[i].e, d: a[i].d }) !== a[i].h) return i;
      }
      return -1;
    }
    async auditCsv() {
      this.audit('audit_exported', 'Audit log exported');
      await this.save();
      const q = s => /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      const rows = ['timestamp,event,detail,prev_hash,hash'];
      for (const e of this.s.audit) rows.push([new Date(e.t).toISOString(), e.e, q(e.d), e.p, e.h].join(','));
      rows.push(`# user,${q(this.s.me.name)} (${this.s.id.slice(0, 8)}),integrity,${(await this.verifyAudit()) < 0 ? 'verified' : 'FAILED'}`);
      return rows.join('\n') + '\n';
    }
  }

  Object.assign(CP2, { Engine, TEXT_MIME, MAX_FILE, REPUBLISH_AFTER, GIVE_UP_AFTER, INVITE_LIFE, SMS_GAP });
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* CipherPost 2 — platform adapters: Android app shell (staff) or web browser (patients). © 2026 RM Software. */
(function (G) {
  'use strict';
  const CP2 = G.CP2 = G.CP2 || {};
  const OFFICIAL_PAGE = 'https://securedmessage.github.io/cipherpost/';
  const DEFAULT_RELAY = 'https://ntfy.sh';

  // ------------------------------------------------------------ Android shell bridge
  let seq = 0;
  const waiting = new Map();
  G.CPNativeCallback = (id, json) => {
    const w = waiting.get(id); if (!w) return;
    waiting.delete(id);
    let r; try { r = JSON.parse(json); } catch (e) { r = { error: 'bad reply' }; }
    if (r && r.error) w.reject(new Error(r.error)); else w.resolve(r ? r.value : null);
  };
  function native(method, ...args) {
    return new Promise((resolve, reject) => {
      const id = 'c' + (++seq);
      waiting.set(id, { resolve, reject });
      try { G.CPNative.call(method, JSON.stringify(args), id); } catch (e) { waiting.delete(id); reject(e); }
    });
  }

  function androidPlatform() {
    return {
      kind: 'android', role: 'staff', page: OFFICIAL_PAGE, defaultRelay: DEFAULT_RELAY,
      device: {
        seal: async b => CP2.b64d(await native('deviceSeal', CP2.b64e(b))),
        open: async b => CP2.b64d(await native('deviceOpen', CP2.b64e(b))),
      },
      bio: {
        available: () => native('bioAvailable'),
        enabled: () => native('bioEnabled'),
        enable: dek => native('bioEnable', CP2.b64e(dek)),
        unlock: async () => { const v = await native('bioUnlock'); return v ? CP2.b64d(v) : null; },
        disable: () => native('bioDisable'),
      },
      sendSms: (phone, text) => native('sendSms', phone, text),
      shareText: (text, subject) => native('shareText', text, subject || ''),
      sendEmail: (to, subject, body) => native('sendEmail', to, subject, body),
      saveFile: (name, mime, bytes) => native('saveFile', name, mime, CP2.b64e(bytes)),
      viewFile: async (name, mime, bytes) => {
        if (mime === 'application/pdf') return native('viewPdf', name, CP2.b64e(bytes));
        return null; // images and text are shown inside the app
      },
      setInbox: (relay, topic) => native('setInbox', relay, topic),
      clearInbox: () => native('setInbox', '', ''),
      version: () => native('version'),
      storageName: 'cipherpost2-staff',
    };
  }

  // ------------------------------------------------------------ Web (patients)
  function webPlatform() {
    const page = G.location ? G.location.origin + G.location.pathname : OFFICIAL_PAGE;
    async function shareText(text, subject) {
      if (G.navigator.share) { try { await G.navigator.share({ text, title: subject }); return 'shared'; } catch (e) { if (e.name === 'AbortError') return 'cancelled'; } }
      try { await G.navigator.clipboard.writeText(text); return 'copied'; } catch (e) { return 'failed'; }
    }
    return {
      kind: 'web', role: 'patient', page, defaultRelay: DEFAULT_RELAY, device: null, bio: null,
      sendSms: async () => 'unavailable',
      shareText,
      sendEmail: async (to, subject, body) => { G.location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`; return 'opened'; },
      saveFile: async (name, mime, bytes) => {
        const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
        const a = G.document.createElement('a'); a.href = url; a.download = name;
        G.document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        return true;
      },
      viewFile: async (name, mime, bytes) => {
        if (mime !== 'application/pdf') return null;
        const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
        G.open(url, '_blank');
        setTimeout(() => URL.revokeObjectURL(url), 120000);
        return true;
      },
      setInbox: async () => {}, clearInbox: async () => {}, version: async () => '2.0',
      storageName: 'cipherpost2',
    };
  }

  // ------------------------------------------------------------ Windows desktop (Electron shell, staff)
  function desktopPlatform() {
    const D = G.CPDesktop;
    return {
      kind: 'desktop', role: 'staff', page: OFFICIAL_PAGE, defaultRelay: DEFAULT_RELAY,
      device: {   // Windows DPAPI via Electron safeStorage: data opens only for this Windows user on this PC
        seal: async b => CP2.b64d(await D.deviceSeal(CP2.b64e(b))),
        open: async b => CP2.b64d(await D.deviceOpen(CP2.b64e(b))),
      },
      bio: null,
      sendSms: async () => 'unavailable',
      shareText: async (text) => { await D.copyText(text); return 'copied'; },
      sendEmail: (to, subject, body) => D.openExternal(`mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`),
      saveFile: (name, mime, bytes) => D.saveFile(name, CP2.b64e(bytes)),
      viewFile: async (name, mime, bytes) => (mime === 'application/pdf' ? D.viewPdf(name, CP2.b64e(bytes)) : null),
      notify: (title, body) => D.notify(title, body),
      setInbox: async () => {}, clearInbox: async () => {},
      version: () => D.version(),
      storageName: 'cipherpost2-desktop',
    };
  }

  CP2.platform = () => (G.CPNative ? androidPlatform() : G.CPDesktop ? desktopPlatform() : webPlatform());
  Object.assign(CP2, { OFFICIAL_PAGE, DEFAULT_RELAY });
})(typeof window !== 'undefined' ? window : globalThis);

  let pendingLink = null;          // an invite (or other CipherPost link) waiting to be handled

  }
  function go(v) { view = v; render(); }
  let renderQueued = false;
  function scheduleRender() {

    requestAnimationFrame(() => { renderQueued = false; if (E.isUnlocked()) render(true); });
  }
  function render(soft) {

    if (soft && (view.name === 'settings' || view.name === 'file' || view.name === 'help' || view.name === 'audit')) return;

    show(h('main', { class: 'center-col' },
      h('div', { class: 'logo' }, '💬'), h('h1', null, 'Messages'),

  async function screenJoin(text) {

    } }, 'Connect');

      h('div', { class: 'card' },
        h('label', null, 'Choose a passcode — at least 6 digits. You\'ll enter it to read your messages.'), p1, p2, err, btn, alreadySignedUp()),
      h('p', { class: 'small muted c' }, 'Tip: use this same browser each time to see your messages.'),
      footer()));
  }

  /** "Already signed up?" link for the sign-up screens. CipherPost keeps each person's messages on the device
      where they signed up, so returning users are sent back there (there is no central account to log in to). */
  const alreadySignedUp = () => h('button', { class: 'link', onclick: () => alertBox('Sign in', STAFF
    ? 'Open CipherPost on the phone or computer where you first set it up — your conversations are kept there. Using a new device as well? Set it up here, then invite your patients and colleagues again from this device.'
    : 'Open your messages on the phone and browser you used when you signed up — they\'re kept there. If you\'ve changed phones or cleared your browser, ask your care team to send you a new invite.') }, 'Already signed up? Sign in');

  /** Turns technical error messages into plain language; friendly messages pass through unchanged. */
  function plain(e) {
    const m = String((e && e.message) || e || '');
    if (/^(Damaged|Invalid code|Unsupported|Contact card|Signature|Join card|Not a CipherPost|Not for me|Unknown sender|Bad invite)/i.test(m)) return 'This link is incomplete or no longer valid. Please ask for a new invite.';
    if (/^Relay|Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Couldn\'t connect. Check your internet connection and try again.';
    if (/File was altered/i.test(m)) return 'This file didn\'t arrive correctly. Ask them to send it again.';
    if (/Data is damaged|Storage|No data|bad base-64|Damaged data|OperationError/i.test(m)) return 'Something went wrong on this device. Please try again.';
    return m || 'Something went wrong. Please try again.';
  }

  /** An invite opened in the wrong place (e.g. a staff invite in a browser, or a patient invite in the app). */
  function screenWrongPlace(text, why) {
    const isWeb = P.kind === 'web';
    const payload = (/(CP2I\.[A-Za-z0-9_-]+)/.exec(text) || [])[1] || '';
    const android = isWeb && /Android/i.test(G.navigator.userAgent);
    show(h('main', { class: 'center-col' },
      h('div', { class: 'logo' }, '📱'), h('h1', null, isWeb ? 'Open this in the CipherPost app' : 'This invite is for a patient'),
      h('p', { class: 'muted c' }, why),
      isWeb ? h('div', { class: 'card' },
        android ? h('a', { class: 'btn primary', href: 'intent://open?p=' + encodeURIComponent(payload) + '#Intent;scheme=cipherpost;package=com.rmsoftware.cipherpost;end' }, 'Open in the CipherPost app') : null,
        !android ? h('a', { class: 'btn primary', href: 'cipherpost://open?p=' + encodeURIComponent(payload) }, 'Open in CipherPost for Windows') : null,
        h('button', { onclick: async () => { const r = await P.shareText(P.page + '#' + payload); if (r === 'copied') toast('Copied — paste it into CipherPost'); } }, 'Copy the link')) : null,
      !isWeb ? h('button', { onclick: () => { pendingLink = null; route(); } }, 'Back') : null,
      footer()));
  }

  // ============================================================ lock
  async function screenLock() {
    const meta = await store.meta();
    const pin = pinInput('Passcode');
    const status = h('p', { class: 'warn c', role: 'status' });
    const btn = h('button', { class: 'primary' }, 'Unlock');
    const invNote = pendingLink && !STAFF ? h('p', { class: 'muted c' }, 'You have a new invite. Enter your passcode to add it.') : null;
    const refresh = async () => {
      const m = await store.meta(); if (!m) return route();
      const wait = (m.lockoutUntil || 0) - Date.now();
      if (wait > 0) { btn.disabled = true; status.textContent = `Too many wrong attempts. Try again in ${Math.ceil(wait / 1000)} s.`; setTimeout(refresh, 1000); }
      else { btn.disabled = false; status.textContent = m.fails ? `${m.fails} wrong attempt(s).${m.wipe ? ` Everything is erased after ${CP2.MAX_FAILS}.` : ''}` : ''; }
    };
    const attempt = async () => {
      if (!pin.value || btn.disabled) return;
      btn.disabled = true; btn.textContent = 'Unlocking…';
      try { await E.unlock(pin.value); await afterUnlock(); }
      catch (e) {
        btn.textContent = 'Unlock'; pin.value = '';
        if (e.erased) { await alertBox('Data erased', 'Too many wrong passcodes. All CipherPost data on this device has been erased.'); return route(); }
        if (!e.wrongPasscode && !e.lockedOut) status.textContent = plain(e);
        await refresh();
        if (e.wrongPasscode) toast('Wrong passcode');
      }
    };
    btn.onclick = attempt;
    pin.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
    let bioBtn = null;
    if (P.bio && await P.bio.enabled().catch(() => false)) {
      const tryBio = async () => {
        try { const dek = await P.bio.unlock(); if (!dek) return; await E.unlockWithDek(dek); await afterUnlock(); }
        catch (e) { status.textContent = plain(e); }
      };
      bioBtn = h('button', { onclick: tryBio }, 'Use fingerprint or face');
      if (!bioTried) { bioTried = true; setTimeout(tryBio, 200); }
    }
    const forgot = h('button', { class: 'link', onclick: async () => {
      if (await confirmBox(STAFF ? 'Forgot your passcode?' : 'Start over?',
        STAFF ? 'The only way back in is to erase CipherPost on this device and set it up again. Your contacts will need to invite you again or be re-invited.'
              : 'This removes your messages from this browser. Your care team can simply invite you again.', 'Erase', true)) {
        await E.erase(); route();
      }
    } }, pendingLink && !STAFF ? 'Not my inbox, or forgot passcode — start fresh' : 'Forgot passcode?');
    show(h('main', { class: 'center-col' },
      h('div', { class: 'logo' }, '💬'), h('h1', null, 'Welcome back'), h('p', { class: 'muted c' }, 'Enter your passcode to see your messages.'), invNote,
      h('div', { class: 'card' }, pin, status, btn, bioBtn, forgot),
      footer()));
    if (meta) refresh();
    setTimeout(() => pin.focus(), 50);
  }

  async function afterUnlock(startView) {
    lastActive = Date.now();
    bioTried = true;
    view = startView || { name: 'home' };
    startTimers();
    P.setInbox(E.me.relay, E.me.inbox).catch(() => {});
    unsubscribe();
    unsubscribe = relay.subscribe(E.me.relay, E.me.inbox, ev => E.live(ev).then(() => notifyIfHidden()));
    if (pendingLink) { const l = pendingLink; pendingLink = null; await handleInviteWhileUnlocked(l); }
    else render();
    syncNow();
  }
  async function syncNow() {
    try { const r = await E.sync(); if (r.received) notifyIfHidden(); setOffline(false); }
    catch (e) { setOffline(true); }
  }
  let offline = false;
  function setOffline(v) { if (offline !== v) { offline = v; scheduleRender(); } }
  function notifyIfHidden() { if (D.hidden && P.notify) P.notify('CipherPost', 'You have a new message'); }

  function startTimers() {
    timers.forEach(clearInterval);
    timers = [
      setInterval(() => { if (E.isUnlocked()) syncNow(); }, 60000),
      setInterval(() => {
        if (!E.isUnlocked()) return;
        const mins = STAFF ? (E.settings().autoLockMin || 5) : 5;
        if (Date.now() - lastActive > mins * 60000) lockNow(`Automatic logoff after ${mins} min of inactivity`);
      }, 5000),
    ];
  }
  async function lockNow(reason) {
    timers.forEach(clearInterval); timers = [];
    unsubscribe(); unsubscribe = () => {};
    bioTried = false;
    freeBlobs();
    D.querySelectorAll('.scrim').forEach(s => s.remove());
    await E.lock(reason);
    route();
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(ev => G.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));
  D.addEventListener('visibilitychange', () => {
    if (D.hidden) { hiddenAt = Date.now(); return; }
    if (E.isUnlocked() && hiddenAt && Date.now() - hiddenAt > 60000 && P.kind !== 'desktop') lockNow('Automatic logoff: app was in the background');
    else if (E.isUnlocked()) syncNow();
  });

  // ============================================================ texting from your own phone (desktop)
  /** Shows a QR code that opens the phone's texting app with the number and text filled in. */
  function qrSvg(data) {
    const q = G.qrcode(0, 'L');
    G.qrcode.stringToBytes = G.qrcode.stringToBytesFuncs['UTF-8'];
    q.addData(data); q.make();
    const n = q.getModuleCount(), NS = 'http://www.w3.org/2000/svg';
    const svg = D.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `-4 -4 ${n + 8} ${n + 8}`); svg.setAttribute('class', 'qr'); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'QR code to text from your phone');
    const bg = D.createElementNS(NS, 'rect');
    bg.setAttribute('x', -4); bg.setAttribute('y', -4); bg.setAttribute('width', n + 8); bg.setAttribute('height', n + 8); bg.setAttribute('fill', '#fff');
    svg.append(bg);
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    const path = D.createElementNS(NS, 'path'); path.setAttribute('d', d); path.setAttribute('fill', '#000');
    svg.append(path);
    return svg;
  }
  async function textFromPhone(name, phone, text) {
    const number = String(phone).replace(/[^\d+]/g, '');
    await modal(`Text ${name} from your phone`, h('div', { class: 'c' },
      h('p', null, 'Point your phone\'s camera at this code. Your texting app opens with the number and message filled in — just press Send.'),
      qrSvg(`SMSTO:${number}:${text}`),
      h('p', { class: 'small muted' }, `To: ${phone}`)),
      [{ label: 'Copy text instead', value: 'copy' }, { label: 'Done', value: null, primary: true }])
      .then(async v => { if (v === 'copy') { await P.shareText(text); toast('Copied'); } });
  }
  const canQr = () => P.kind === 'desktop' && typeof G.qrcode === 'function';

  // ============================================================ invites
  async function handleInviteWhileUnlocked(text) {
    let inv;
    try { inv = await CP2.parseInviteCode(text); CP2.Engine.checkInviteFor(P.role, inv); }
    catch (e) { return screenWrongPlace(text, plain(e)); }
    if (inv.inviter.id === E.myId) { await alertBox('That\'s your own invite', 'Send it to the person you want to connect with.'); return render(); }
    if (E.contact(inv.inviter.id)) return go({ name: 'chat', cid: inv.inviter.id });
    if (!(await confirmBox(`Connect with ${inv.inviter.name}?`, `${inv.inviter.name} invited you to message each other in CipherPost.`, 'Connect'))) return render();
    try { const r = await E.acceptInvite(inv); toast(`Connected with ${inv.inviter.name}`); go({ name: 'chat', cid: r.contact.id }); }
    catch (e) { await alertBox('Couldn\'t connect', plain(e)); render(); }
  }

  async function inviteDialog(type) {
    const patient = type === 'patient';
    const s = E.settings();
    const name = h('input', { placeholder: patient ? 'Patient\'s name' : 'Colleague\'s name', 'aria-label': 'Name' });
    const phone = h('input', { type: 'tel', placeholder: 'Mobile number', 'aria-label': 'Mobile number' });
    const email = h('input', { type: 'email', placeholder: 'Email (optional)', 'aria-label': 'Email' });
    const err = h('p', { class: 'err', role: 'alert' });
    const how = P.kind === 'android' ? 'The invite is texted to them automatically if you enter a mobile number.'
      : 'Your email app opens with the invite ready, or you can copy the link and text it.';
    const ok = await modal(patient ? 'Invite a patient' : 'Invite a colleague',
      h('div', null, name, phone, email,
        h('p', { class: 'small muted' }, patient ? `They tap the link, choose a passcode and they're connected — nothing to install. ${how}`
                                                 : `They open the link on a phone or PC with CipherPost. ${how}`), err),
      [{ label: 'Cancel', value: false }, { label: 'Send invite', value: true, primary: true, check: () => {
        if (!name.value.trim()) { err.textContent = 'Enter a name'; return false; }
        if (email.value.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())) { err.textContent = 'Check the email address'; return false; }
        return true;
      } }]);
    if (!ok) return;
    void s;
    const r = E.createInvite(type, name.value, phone.value, email.value);
    await deliverInvite(E.pendingInvites().find(i => i.id === r.id));
    render();
  }

  async function deliverInvite(inv) {
    const link = E.inviteLink(inv.id);
    const text = inv.type === 'patient'
      ? `${E.me.name} invited you to message them (nothing to install): ${link}`
      : `${E.me.name} invited you to CipherPost. Open on a device with CipherPost: ${link}`;
    if (inv.phone && P.kind === 'android') {
      const r = await P.sendSms(inv.phone, text).catch(() => 'error');
      if (r === 'sent') return toast(`Invite texted to ${inv.name}`);
    }
    if (inv.phone && canQr()) {
      const v = await modal(`Send the invite to ${inv.name}`, h('p', null, 'How would you like to send it?'),
        [inv.email ? { label: 'Email', value: 'email' } : null, { label: 'Copy', value: 'copy' }, { label: 'Text from my phone', value: 'qr', primary: true }].filter(Boolean));
      if (v === 'qr') return textFromPhone(inv.name, inv.phone, text);
      if (v === 'email') return P.sendEmail(inv.email, 'Secure messaging invitation', text);
      if (v === 'copy') { await P.shareText(text); return toast('Invite copied'); }
      return;
    }
    if (inv.email) { await P.sendEmail(inv.email, 'Secure messaging invitation', text); return; }
    const r = await P.shareText(text, 'Secure messaging invitation');
    if (r === 'copied') toast('Invite copied — paste it into a text or email');
  }

  // ============================================================ home
  function screenHome() {
    const lockBtn = iconBtn('Lock', () => lockNow('Locked by user'), '🔒');
    const menuBtn = iconBtn('Settings and help', () => go({ name: 'settings' }), '⚙️');
    const parts = [];
    if (STAFF) parts.push(h('div', { class: 'row' },
      h('button', { class: 'primary', onclick: () => inviteDialog('patient') }, 'Invite patient'),
      h('button', { onclick: () => inviteDialog('staff') }, 'Invite colleague')));
    if (offline) parts.push(h('p', { class: 'banner' }, 'You\'re offline — messages will send when you\'re back online.'));
    const waiting = STAFF ? E.pendingInvites() : [];
    if (waiting.length) {
      parts.push(h('h3', null, 'Waiting to connect'));
      for (const i of waiting) parts.push(h('button', { class: 'item', onclick: () => waitingActions(i) },
        h('div', { class: 'item-top' }, h('span', { class: 'item-name' }, i.name), h('span', { class: 'tag' }, i.type === 'patient' ? 'patient' : 'colleague')),
        h('div', { class: 'item-sub warn' }, `Invited ${fmtTime(i.created)} · they appear here once they connect`)));
    }
    const cs = E.contacts();
    parts.push(h('h3', null, STAFF ? 'Conversations' : 'Your care team'));
    if (!cs.length) parts.push(h('div', { class: 'card muted' }, STAFF ? 'No conversations yet. Invite a patient or colleague — they appear here as soon as they connect.' : 'No one yet. Open the invite link your care team sent you.'));
    for (const c of cs) {
      const last = c.msgs[c.msgs.length - 1];
      const prev = last ? (last.out ? 'You: ' : '') + (last.file ? `${fileIcon(last.file.mime)} ${last.file.name}` : last.text.replace(/\s+/g, ' ')) : (c.joined ? 'Connected — say hello' : 'No messages yet');
      parts.push(h('button', { class: 'item' + (c.unread ? ' unread' : ''), onclick: () => go({ name: 'chat', cid: c.id }) },
        h('div', { class: 'item-top' }, h('span', { class: 'item-name' }, c.name), STAFF ? h('span', { class: 'tag' }, c.role === 'patient' ? 'patient' : 'colleague') : null,
          c.unread ? h('span', { class: 'badge' }, String(c.unread)) : null),
        h('div', { class: 'item-sub' }, h('span', { class: 'ellipsis' }, prev), last ? h('span', { class: 'time' }, fmtTime(last.rx || last.ts)) : null)));
    }
    show(header(STAFF ? E.me.name : 'Messages', STAFF ? 'CipherPost' : null, null, h('div', { class: 'bar-actions' }, lockBtn, menuBtn)),
      h('main', null, parts), footer());
  }

  async function waitingActions(i) {
    const v = await modal(`Waiting for ${i.name}`,
      h('p', null, `${i.name} appears in your conversations as soon as they open the invite and connect — nothing else to do. Invites work once and expire after 30 days.`),
      [{ label: 'Cancel invite', value: 'cancel', danger: true }, { label: 'Send again', value: 'resend' }, { label: 'Close', value: null, primary: true }]);
    if (v === 'resend') await deliverInvite(i);
    if (v === 'cancel') { await E.cancelInvite(i.id); render(); }
  }

  // ============================================================ conversation
  let threadEl = null, chatCid = null;
  function screenChat(cid) {
    const c = E.contact(cid);
    chatCid = cid;
    E.markRead(cid);
    const back = iconBtn('Back', () => go({ name: 'home' }), '‹');
    const info = iconBtn('Contact details', () => contactInfo(cid), 'ⓘ');
    threadEl = h('div', { class: 'thread', 'aria-live': 'polite' });
    const input = h('textarea', { rows: 2, placeholder: `Message ${c.name}`, 'aria-label': 'Message', maxlength: 20000 });
    input.addEventListener('input', () => { lastActive = Date.now(); });
    const send = h('button', { class: 'primary send', onclick: async () => {
      const text = input.value; if (!text.trim()) return;
      send.disabled = true;
      try { const r = await E.send(cid, text); input.value = ''; await afterSend(c, r); }
      catch (e) { toast(plain(e)); }
      send.disabled = false; input.focus();
    } }, 'Send');
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send.click(); });
    const fileIn = h('input', { type: 'file', class: 'hidden', 'aria-hidden': 'true' });
    fileIn.addEventListener('change', async () => {
      const f = fileIn.files[0]; fileIn.value = '';
      if (!f) return;
      if (f.size > CP2.MAX_FILE) return alertBox('File too large', 'Files can be up to 15 MB.');
      try {
        const r = await E.sendFile(cid, { name: f.name, mime: f.type || 'application/octet-stream', bytes: new Uint8Array(await f.arrayBuffer()) }, input.value.trim());
        input.value = '';
        await afterSend(c, r);
      } catch (e) { alertBox('Couldn\'t send file', plain(e)); }
    });
    const attach = iconBtn('Attach a file', () => fileIn.click(), '📎');
    show(header(c.name, c.role === 'patient' ? 'Patient' : STAFF ? 'Colleague' : 'Care team', back, info),
      h('main', { class: 'chat' }, threadEl),
      h('div', { class: 'composer' }, attach, input, send, fileIn));
    renderThread(true);
  }

  async function afterSend(c, r) {
    if (!r) return;
    if (r.smsNotice && P.kind === 'android') {
      const s = await P.sendSms(r.smsNotice.phone, r.smsNotice.text).catch(() => 'error');
      if (s === 'sent') { E.noteSmsSent(c.id); toast(`${firstName(c.name)} was texted a notice (no message content)`); return; }
    }
    if (STAFF && c.role === 'patient' && (r.smsNotice || (!c.phone && c.email)) && (c.email || P.kind !== 'android')) {
      // desktop (or a phone without SMS permission): offer to text from your own phone, email, or copy the notice
      const now = Date.now();
      if (c.lastEmailPrompt && now - c.lastEmailPrompt < CP2.SMS_GAP && !c.repliedSinceSms) return;
      c.lastEmailPrompt = now;
      const text = `You have a new message from ${E.me.name}. Read it here: ${P.page}`;
      const bar = h('div', { class: 'notice-bar' }, `Let ${firstName(c.name)} know there's a message?`,
        c.phone && canQr() ? h('button', { onclick: async () => { bar.remove(); await textFromPhone(c.name, c.phone, text); E.noteSmsSent(c.id); } }, 'Text from my phone') : null,
        c.email ? h('button', { onclick: async () => { await P.sendEmail(c.email, `New message from ${E.me.name}`, text); E.noteSmsSent(c.id); bar.remove(); } }, 'Email notice') : null,
        h('button', { onclick: async () => { const s = await P.shareText(text); if (s === 'copied') toast('Notice copied'); E.noteSmsSent(c.id); bar.remove(); } }, 'Copy notice'),
        h('button', { class: 'link', onclick: () => bar.remove() }, 'No'));
      const comp = D.querySelector('.composer'); if (comp) comp.before(bar);
    }
  }

  function renderThread(initial) {
    const c = E.contact(chatCid);
    if (!threadEl || !c || view.name !== 'chat') return;
    const nearBottom = initial || threadEl.scrollHeight - threadEl.scrollTop - threadEl.clientHeight < 80;
    const nodes = [];
    if (!c.msgs.length) nodes.push(h('p', { class: 'muted c' }, c.joined || !STAFF ? `You're connected with ${c.name}. Say hello!` : 'No messages yet.'));
    for (const m of c.msgs) nodes.push(bubble(c, m));
    threadEl.replaceChildren(...nodes);
    E.markRead(chatCid);
    if (nearBottom) requestAnimationFrame(() => { threadEl.scrollTop = threadEl.scrollHeight; });
  }

  const STATUS = { sending: 'Sending…', sent: 'Sent ✓', delivered: 'Delivered ✓✓', failed: 'Not delivered ⚠' };
  function bubble(c, m) {
    const kids = [];
    if (m.file) {
      const st = m.file.state;
      const thumb = h('div', { class: 'thumb' });
      if (st === 'ready' && m.file.mime.startsWith('image/') && m.file.size < 8 * 1048576) {
        E.fileBytes(c.id, m.id).then(b => { thumb.append(h('img', { src: blobUrl(b, m.file.mime), alt: m.file.name })); }).catch(() => {});
      }
      kids.push(thumb, h('div', { class: 'fname' }, `${fileIcon(m.file.mime)} ${m.file.name}`),
        h('div', { class: 'small' }, fmtSize(m.file.size), ' · ',
          st === 'ready' ? 'tap to open' : st === 'requested' ? 'link expired — asking for it again…' : st === 'failed' ? 'download failed — tap to retry' : 'downloading…'));
      if (m.text) kids.push(h('div', { class: 'text' }, m.text));
    } else kids.push(h('div', { class: 'text' }, m.text));
    kids.push(h('div', { class: 'meta' }, fmtTime(m.out ? m.ts : (m.rx || m.ts)), m.out ? ' · ' + (STATUS[m.status] || '') : ''));
    const b = h('div', { class: 'bubble ' + (m.out ? 'out' : 'in') + (m.status === 'failed' ? ' failed' : ''), tabindex: '0',
                          onclick: () => m.file ? openFile(c, m) : null,
                          oncontextmenu: e => { e.preventDefault(); messageActions(c, m); } }, kids);
    let t; b.addEventListener('touchstart', () => { t = setTimeout(() => messageActions(c, m), 600); }, { passive: true });
    b.addEventListener('touchend', () => clearTimeout(t));
    return b;
  }

  async function messageActions(c, m) {
    const v = await modal('Message', h('p', { class: 'muted' }, 'Delete removes it from this device only.'),
      [{ label: 'Cancel', value: null }, { label: 'Delete from this device', value: 'del', danger: true }]);
    if (v === 'del') await E.deleteMessage(c.id, m.id);
  }

  async function contactInfo(cid) {
    const c = E.contact(cid);
    const v = await modal(c.name, h('div', null,
      h('p', null, c.role === 'patient' ? 'Patient' : STAFF ? 'Colleague' : 'Care team'),
      c.phone || c.email ? h('p', { class: 'muted' }, [c.phone, c.email].filter(Boolean).join(' · ')) : null),
      [{ label: 'Delete contact', value: 'del', danger: true }, { label: 'Close', value: null, primary: true }]);
    if (v === 'del' && await confirmBox(`Delete ${c.name}?`, 'Removes them and your conversation from this device. You would need to invite them again.', 'Delete', true)) {
      await E.deleteContact(cid); go({ name: 'home' });
    }
  }

  // ============================================================ files
  async function openFile(c, m) {
    if (m.file.state !== 'ready') {
      if (m.file.state === 'failed' || m.file.state === 'requested') { toast('Trying again…'); await E.retryFile(c.id, m.id); }
      return;
    }
    let bytes;
    try { bytes = await E.fileBytes(c.id, m.id, 'view'); } catch (e) { return alertBox('Couldn\'t open file', plain(e)); }
    const mime = m.file.mime;
    if (await P.viewFile(m.file.name, mime, bytes)) return;
    const back = iconBtn('Back', () => go({ name: 'chat', cid: c.id }), '‹');
    let body;
    if (mime.startsWith('image/')) body = h('img', { class: 'viewer-img', src: blobUrl(bytes, mime), alt: m.file.name });
    else if (mime.startsWith('text/') || mime === 'application/json') body = h('pre', { class: 'viewer-text' }, CP2.str(bytes.slice(0, 512 * 1024)));
    else body = h('div', { class: 'card c' }, h('div', { class: 'logo' }, fileIcon(mime)), h('p', null, 'CipherPost can\'t preview this type of file. You can save a copy to open it in another program.'));
    view = { name: 'file' };
    show(header(m.file.name, `${fmtSize(m.file.size)} · ${m.out ? 'sent to' : 'from'} ${c.name}`, back),
      h('main', null, m.text ? h('p', null, m.text) : null, body,
        h('button', { onclick: () => saveCopy(c, m) }, 'Save a copy…')));
  }
  async function saveCopy(c, m) {
    if (!(await confirmBox('Save a copy outside CipherPost?', (STAFF ? 'The saved copy isn\'t protected by CipherPost — other apps and anyone using this device may be able to open it. Only save it if your organization\'s policy allows it. The save is recorded in the audit log.' : 'The saved copy won\'t be protected by your passcode — anyone using this device may be able to open it.'), 'Save'))) return;
    try { const b = await E.fileBytes(c.id, m.id, 'save'); await P.saveFile(m.file.name, m.file.mime, b); }
    catch (e) { alertBox('Couldn\'t save', plain(e)); }
  }

  // ============================================================ settings, audit, help, about
  async function screenSettings() {
    const back = iconBtn('Back', () => go({ name: 'home' }), '‹');
    const s = E.settings();
    const rows = [];
    const row = (label, value, onclick) => h('button', { class: 'item', onclick }, h('div', { class: 'item-top' }, h('span', { class: 'item-name' }, label)), value ? h('div', { class: 'item-sub' }, value) : null);
    if (STAFF) {
      const meta = await store.meta();
      rows.push(h('h3', null, 'Security'));
      rows.push(row('Automatic logoff', `After ${s.autoLockMin} minutes without use`, async () => {
        const sel = h('select', { 'aria-label': 'Minutes' }, [1, 2, 5, 10, 15].map(n => h('option', { value: n, selected: n === s.autoLockMin ? 'selected' : null }, `${n} minute${n > 1 ? 's' : ''}`)));
        if (await modal('Log off automatically after', sel, [{ label: 'Cancel', value: false }, { label: 'Save', value: true, primary: true }])) { await E.setSetting('autoLockMin', +sel.value, 'Automatic logoff (min)'); render(); }
      }));
      rows.push(row('Delete old messages', s.retentionDays ? `After ${s.retentionDays} days` : 'Keep until deleted', async () => {
        const sel = h('select', { 'aria-label': 'Days' }, [0, 7, 30, 90, 365].map(n => h('option', { value: n, selected: n === s.retentionDays ? 'selected' : null }, n ? `After ${n} days` : 'Keep until deleted')));
        if (await modal('Delete messages older than', sel, [{ label: 'Cancel', value: false }, { label: 'Save', value: true, primary: true }])) {
          await E.setSetting('retentionDays', +sel.value, 'Message retention (days)'); await E.applyRetention(); await E.save(); render();
        }
      }));
      if (P.bio && await P.bio.available().catch(() => false)) {
        const on = await P.bio.enabled().catch(() => false);
        rows.push(row('Unlock with fingerprint or face', on ? 'On' : 'Off', async () => {
          if (on) { await P.bio.disable(); E.audit('setting_changed', 'Fingerprint/face unlock: off'); await E.save(); return render(); }
          if (!(await confirmBox('Unlock with fingerprint or face?', 'CipherPost will also open with your phone\'s own lock — so anyone who knows the phone\'s PIN can open it. Your passcode keeps working. Check that your organization\'s policy allows this.', 'Turn on'))) return;
          try { if (await P.bio.enable(store.exportDek())) { E.audit('setting_changed', 'Fingerprint/face unlock: on'); await E.save(); toast('Fingerprint/face unlock is on'); } }
          catch (e) { alertBox('Couldn\'t turn it on', plain(e)); }
          render();
        }));
      }
      rows.push(row('Erase after 10 wrong passcodes', meta.wipe ? 'On' : 'Off', async () => {
        await store.setWipe(!meta.wipe); E.audit('setting_changed', `Erase after 10 wrong passcodes: ${!meta.wipe ? 'on' : 'off'}`); await E.save(); render();
      }));
      if (P.kind === 'android') rows.push(row('Text patients a notice when you message them', s.smsNotices ? 'On — no message content is included' : 'Off', async () => { await E.setSetting('smsNotices', !s.smsNotices, 'SMS notices'); render(); }));
      rows.push(row('Audit log', 'Every access, message and change, tamper-evident', () => go({ name: 'audit' })));
    }
    rows.push(h('h3', null, 'Account'));
    rows.push(row('Change passcode', null, changePasscode));
    rows.push(row('Lock now', null, () => lockNow('Locked by user')));
    rows.push(h('h3', null, 'Help'));
    rows.push(row('How CipherPost works', null, () => go({ name: 'help' })));
    rows.push(row('About', null, about));
    rows.push(h('h3', null, 'Danger zone'));
    rows.push(h('button', { class: 'danger', onclick: async () => {
      if (await confirmBox('Erase everything?', 'Permanently deletes your contacts and messages on this device. This cannot be undone.', 'Erase', true)) { await lockNow(null); await E.erase(); route(); }
    } }, 'Erase all CipherPost data on this device'));
    show(header('Settings', null, back), h('main', null, rows), footer());
  }

  async function changePasscode() {
    const cur = pinInput('Current passcode'), n1 = pinInput('New passcode'), n2 = pinInput('Repeat new passcode');
    const err = h('p', { class: 'err' });
    const ok = await modal('Change passcode', h('div', null, cur, n1, n2, err), [{ label: 'Cancel', value: false }, { label: 'Change', value: true, primary: true, check: async () => {
      const pp = passProblem(n1.value); if (pp) { err.textContent = pp; return false; }
      if (n1.value !== n2.value) { err.textContent = "Passcodes don't match"; return false; }
      try { await E.changePasscode(cur.value, n1.value); return true; } catch (e) { err.textContent = e.wrongPasscode ? 'Current passcode is wrong' : plain(e); return false; }
    } }]);
    if (ok) toast('Passcode changed');
  }

  async function screenAudit() {
    const back = iconBtn('Back', () => go({ name: 'settings' }), '‹');
    const bad = await E.verifyAudit();
    const a = E.s.audit;
    const exp = h('button', { onclick: async () => {
      if (!(await confirmBox('Export audit log?', 'The file lists names and activity times, which may be protected health information. Store it as your organization\'s policy requires.', 'Export'))) return;
      const csv = await E.auditCsv();
      await P.saveFile(`cipherpost-audit-${new Date().toISOString().slice(0, 10)}.csv`, 'text/csv', CP2.utf8(csv));
    } }, 'Export CSV…');
    const list = a.slice(-500).reverse().map(e => h('div', { class: 'audit-row' },
      h('div', { class: 'mono' + (/fail|reject|saved|erase/.test(e.e) ? ' warn' : '') }, `${new Date(e.t).toLocaleString()}  ${e.e}`),
      e.d ? h('div', { class: 'small muted' }, e.d) : null));
    show(header('Audit log', `${a.length} entries`, back, exp),
      h('main', null, h('div', { class: 'card ' + (bad < 0 ? 'ok' : 'danger-text') }, bad < 0 ? '✓ Integrity verified — every entry is linked to the one before it, so nothing has been altered or removed.' : `⚠ Integrity check failed at entry ${bad + 1}.`),
        h('p', { class: 'small muted' }, `User: ${E.me.name} (${E.myId.slice(0, 8)}). Message contents are never written to the log.`), list));
  }

  function screenHelp() {
    const back = iconBtn('Back', () => go({ name: 'settings' }), '‹');
    const sec = (t, ...p) => h('section', { class: 'card' }, h('h3', null, t), p.map(x => h('p', null, x)));
    const staff = [
      sec('Inviting a patient', 'Tap Invite patient, enter their name and mobile number or email, and send. They tap the link, choose a passcode, and appear in your conversations by themselves. Patients install nothing.'),
      sec('Inviting a colleague', 'Tap Invite colleague. They open the link on a phone or PC with CipherPost and tap Connect. Each invite works once and expires after 30 days; until then it shows under Waiting to connect.'),
      sec('Messages', 'Type and tap Send (Ctrl+Enter on a PC). Messages arrive by themselves. Sending… → Sent ✓ → Delivered ✓✓ once it has reached their device. If someone is offline, CipherPost keeps re-sending for up to 14 days.'),
      sec('Patients are notified', P.kind === 'android' ? 'When you message a patient who has a mobile number, the app texts them a short notice (no message content). Turn this off in Settings.' : 'After messaging a patient, CipherPost offers to let them know: "Text from my phone" shows a QR code — point your phone\'s camera at it and your texting app opens with the notice ready to send. Email and Copy work too. The notice never contains the message.'),
      sec('Files', 'Tap 📎 to send a photo, PDF or other file up to 15 MB; anything in the message box goes as its caption. Received files stay safely inside CipherPost. Saving a copy outside CipherPost is recorded in the audit log.'),
      P.kind === 'desktop' ? sec('Staying in the tray', 'Closing the window keeps CipherPost running in the tray so it can tell you about new messages. To quit, right-click the tray icon and choose Quit CipherPost.') : null,
      sec('Security', 'CipherPost locks after a few minutes without use. After 5 wrong passcodes you must wait; after 10 everything is erased (can be turned off). Settings has the audit log, retention, and fingerprint/face unlock on phones.'),
    ];
    const patient = [
      sec('Reading messages', 'When your care team writes, you get a text or email saying so. Open this page in the same browser, enter your passcode, and the message appears.'),
      sec('Replying', 'Type and tap Send. Tap 📎 to send a photo or file. Delivered ✓✓ means it has reached your care team.'),
      sec('Keep it private', 'Use this same browser each time. If you clear your browser data or forget your passcode, ask your care team to invite you again.'),
    ];
    show(header('Help', null, back), h('main', null, STAFF ? staff.filter(Boolean) : patient), footer());
  }

  async function about() {
    const v = await P.version().catch(() => '2.0');
    await modal('About CipherPost', h('div', null,
      h('p', null, `CipherPost ${v}${P.kind === 'desktop' ? ' for Windows' : P.kind === 'android' ? ' for Android' : ''}`),
      h('p', null, 'Private messages and files between care teams and patients. Only the people in a conversation can read it.'),
      h('p', { class: 'small muted' }, 'For your IT or compliance team: messages and files are end-to-end encrypted (AES-256-GCM with signed P-256 keys) on the sender\'s device and decrypted only on the recipient\'s.'),
      h('p', null, '© 2026 RM Software. All rights reserved.')));
  }

  // ============================================================ start
  G.addEventListener('error', e => console.error(e.error || e.message));
  if (!G.isSecureContext || !G.crypto || !G.crypto.subtle) {
    show(h('main', { class: 'center-col' }, h('h1', null, 'Please update your browser'), h('p', null, 'This page needs an up-to-date browser such as Chrome, Safari, Edge or Firefox.')));
  } else route();
})(window);
</script>
</body>
</html>
